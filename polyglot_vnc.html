<!DOCTYPE html>
<html lang="en">
<head>
    <title>Polyglot AI Tutor</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #2b2b2b; overflow: hidden; }
        #top_bar {
            height: 28px;
            background: linear-gradient(to bottom, #6b89a8 0%, #4e6e8e 100%);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px; color: white; font: bold 12px sans-serif;
        }
        #status { flex: 1; text-align: center; }
        .top-btn {
            cursor: pointer; padding: 2px 8px;
            background: rgba(255,255,255,0.15); border-radius: 3px;
            margin-left: 6px;
        }
        .top-btn:hover { background: rgba(255,255,255,0.3); }
        #screen { width: 100%; height: calc(100% - 28px); position: relative; }
    </style>

    <script type="module">
        import RFB from './core/rfb.js';

        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const portPart = window.location.port ? ':' + window.location.port : '';
        const url = protocol + window.location.hostname + portPart + '/websockify';
        const rfb = new RFB(document.getElementById('screen'), url);

        rfb.scaleViewport = true;
        rfb.resizeSession = false;

        rfb.addEventListener("connect", () => {
            document.getElementById('status').textContent = 'Connected';

            const screenDiv = document.getElementById('screen');

            // Create transparent textarea overlay for IME support
            const textarea = document.createElement('textarea');
            textarea.setAttribute('autocomplete', 'off');
            textarea.setAttribute('autocorrect', 'off');
            textarea.setAttribute('autocapitalize', 'off');
            textarea.setAttribute('spellcheck', 'false');
            textarea.style.cssText = [
                'position:absolute', 'top:0', 'left:0',
                'width:100%', 'height:100%',
                'opacity:0', 'z-index:10',
                'cursor:default', 'pointer-events:none',
                'resize:none', 'border:none', 'outline:none',
                'font-size:16px', 'color:transparent', 'background:transparent'
            ].join(';');
            screenDiv.appendChild(textarea);

            // Detach noVNC's keyboard handler completely
            rfb._keyboard.ungrab();

            // Override focus so canvas doesn't steal it
            rfb.focus = function(options) {
                textarea.focus(options || { preventScroll: true });
            };

            // Focus textarea when clicking in the VNC area
            screenDiv.addEventListener('mousedown', () => {
                textarea.focus({ preventScroll: true });
            });

            // === Custom keyboard handling ===
            let composing = false;
            let justComposed = false;
            let syncQueue = Promise.resolve();

            function syncIME(path, text) {
                syncQueue = syncQueue.then(() => 
                    fetch(path, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    })
                ).catch(e => console.error(e));
            }

            textarea.addEventListener('compositionstart', () => {
                composing = true;
            });

            // Live preview: send intermediate composition text to the input field
            textarea.addEventListener('compositionupdate', (e) => {
                const text = e.data || '';
                syncIME('/api/compose', text);
            });

            textarea.addEventListener('compositionend', (e) => {
                composing = false;
                justComposed = true;
                const text = e.data || '';
                // Send final composed text to input field
                syncIME('/api/insert', text);
                setTimeout(() => { textarea.value = ''; justComposed = false; }, 50);
            });

            // Forward non-composition key events to VNC
            textarea.addEventListener('keydown', (e) => {
                if (composing || e.isComposing || e.keyCode === 229) {
                    return;
                }
                // Suppress the Enter key that fires right after compositionend
                // (the user pressed Enter to confirm composition, not to send)
                if (justComposed && e.key === 'Enter') {
                    e.preventDefault();
                    return;
                }
                rfb._keyboard._handleKeyDown(e);
            });

            textarea.addEventListener('keyup', (e) => {
                if (composing || e.isComposing || e.keyCode === 229) {
                    return;
                }
                if (justComposed && e.key === 'Enter') {
                    return;
                }
                rfb._keyboard._handleKeyUp(e);
            });

            // Clear textarea for non-composition input
            textarea.addEventListener('input', () => {
                if (!composing) {
                    textarea.value = '';
                }
            });

            // Initial focus
            textarea.focus({ preventScroll: true });
        });

        rfb.addEventListener("disconnect", (e) => {
            document.getElementById('status').textContent =
                e.detail.clean ? 'Disconnected' : 'Connection lost';
        });

        rfb.addEventListener("credentialsrequired", () => {
            const pw = prompt("Password Required:");
            rfb.sendCredentials({ password: pw });
        });

        // Top bar buttons
        document.getElementById('sendCtrlAltDelButton').onclick = () => rfb.sendCtrlAltDel();

        // === BROWSER AUDIO PLAYER ===
        // Polls the Python backend for audio files to play.
        // TTS engines generate audio files -> Python queues them -> JS plays them.
        let audioPlaying = false;
        let lastPlayedFile = null;

        async function checkAudio() {
            if (audioPlaying) return;
            try {
                const resp = await fetch('/api/audio/status');
                const data = await resp.json();
                if (data.file && data.file !== lastPlayedFile) {
                    lastPlayedFile = data.file;
                    audioPlaying = true;
                    // Note: Python returns a path like '/audio/file/...', we prefix with '/api'
                    const audioUrl = '/api' + data.file;
                    const audio = new Audio(audioUrl);
                    audio.volume = (typeof data.volume === 'number') ? data.volume : 1.0;
                    audio.onended = async () => {
                        audioPlaying = false;
                        try { await fetch('/api/audio/done'); } catch(e) {}
                    };
                    audio.onerror = async () => {
                        console.error('Audio playback error');
                        audioPlaying = false;
                        try { await fetch('/api/audio/done'); } catch(e) {}
                    };
                    audio.play().catch(err => {
                        console.error('Audio play failed:', err);
                        audioPlaying = false;
                        fetch('/api/audio/done').catch(() => {});
                    });
                }
            } catch (e) {
                // Server not ready yet, ignore
            }
        }

        // Poll every 400ms for audio playback
        setInterval(checkAudio, 400);

        // === BROWSER MICROPHONE CAPTURE ===
        let micActive = false;
        let audioContext = null;
        let mediaStream = null;
        let scriptProcessor = null;

        async function checkMicStatus() {
            try {
                const resp = await fetch('/api/audio/mic_status');
                const data = await resp.json();
                
                if (data.active && !micActive) {
                    startMicrophone();
                } else if (!data.active && micActive) {
                    stopMicrophone();
                }
            } catch (e) {}
        }

        async function startMicrophone() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        autoGainControl: false 
                    }, 
                    video: false 
                });
                micActive = true;
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(mediaStream);
                
                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
                
                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);
                
                scriptProcessor.onaudioprocess = (e) => {
                    if (!micActive) return;
                    
                    const float32Array = e.inputBuffer.getChannelData(0);
                    const int16Array = new Int16Array(float32Array.length);
                    
                    for (let i = 0; i < float32Array.length; i++) {
                        let s = Math.max(-1, Math.min(1, float32Array[i]));
                        int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    
                    fetch('/api/audio/input', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/octet-stream' },
                        body: int16Array.buffer
                    }).catch(err => {});
                };
            } catch (err) {
                console.error("Microphone access denied or failed", err);
            }
        }

        function stopMicrophone() {
            micActive = false;
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        // Poll every 500ms for mic status
        setInterval(checkMicStatus, 500);
    </script>
</head>

<body>
    <div id="top_bar">
        <div id="status">Connecting...</div>
        <div>
            <span id="sendCtrlAltDelButton" class="top-btn">Send CtrlAltDel</span>
        </div>
    </div>
    <div id="screen"></div>
</body>
</html>
